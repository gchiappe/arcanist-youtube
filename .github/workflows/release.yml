name: Release

# Pushing a tag v<version> (with a suffix, such as v0.1.0-alpha.1, it is a pre-release) builds the package and
# publishes it, with its SHA-256, as a release administrators install from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ArcanistExtensions/youtube
      - uses: actions/checkout@v4
        with:
          repository: linkfast/arcanist
          ref: ${{ vars.ARCANIST_REF || 'main' }}
          path: Arcanist
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ArcanistExtensions/youtube/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Package
        working-directory: ArcanistExtensions/youtube
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "The tag $GITHUB_REF_NAME does not match the version $version" >&2; exit 1; }
          sh pack.sh
      - name: Test
        working-directory: ArcanistExtensions/youtube
        run: dotnet test --project tests/Arcanist.YouTube.Tests --artifacts-path artifacts/build
      - name: Publish
        working-directory: ArcanistExtensions/youtube
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/arcanist-youtube-*.zip artifacts/arcanist-youtube-*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "YouTube Audio $GITHUB_REF_NAME" --generate-notes $prerelease
